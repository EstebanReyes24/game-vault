# Respaldo semanal de la base de datos de Supabase, cifrado.
#
# Necesita dos secretos en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     cadena de conexión de Supabase (Project Settings →
#                       Database → Connection string → "Session pooler", con tu contraseña)
#   BACKUP_PASSPHRASE   una contraseña larga que guardes tú; sin ella no se puede abrir el respaldo
#
# El archivo queda en la pestaña Actions → la ejecución → "Artifacts", 90 días.
# Para abrirlo:  gpg --decrypt respaldo-AAAA-MM-DD.sql.gz.gpg | gunzip > respaldo.sql
name: Respaldo semanal

on:
  schedule:
    - cron: "41 7 * * 0"   # domingos, 03:41 en Bolivia/Rep. Dominicana
  workflow_dispatch: {}      # botón "Run workflow" para hacerlo a mano

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar secretos
        id: secretos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::warning::Faltan los secretos SUPABASE_DB_URL o BACKUP_PASSPHRASE. No se hizo el respaldo."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar pg_dump 17
        if: steps.secretos.outputs.listo == 'si'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Volcar y cifrar
        if: steps.secretos.outputs.listo == 'si'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          FECHA=$(date -u +%F)
          # Tolera espacios, saltos de línea o comillas pegados sin querer al copiar
          DB=$(printf '%s' "$DB" | tr -d '\r\n' | sed -E "s/^[[:space:]\"']+//; s/[[:space:]\"']+$//")
          case "$DB" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::SUPABASE_DB_URL no tiene el formato correcto: debe empezar exactamente por postgresql:// (sin espacios ni comillas). Edítalo en Settings → Secrets and variables → Actions."; exit 1 ;;
          esac
          case "$DB" in
            *pooler.supabase.com*) ;;
            *) echo "::warning::SUPABASE_DB_URL no parece la del Session pooler (debería contener pooler.supabase.com). GitHub no puede usar la conexión directa." ;;
          esac
          # Los errores de pg_dump pueden incluir partes de la conexión: no se muestran en el registro público
          if ! /usr/lib/postgresql/17/bin/pg_dump "$DB" --no-owner --no-privileges --schema=public --schema=auth \
               -f respaldo.sql 2> pgdump-error.txt; then
            if grep -qi "could not translate host name" pgdump-error.txt; then
              echo "::error::No se pudo leer la dirección de la base de datos. Si tu contraseña tiene símbolos (@ # / : ? &), cámbiala por una solo de letras y números y actualiza SUPABASE_DB_URL."
            elif grep -qi "password authentication failed" pgdump-error.txt; then
              echo "::error::Supabase rechazó la contraseña de SUPABASE_DB_URL."
            elif grep -qi "permission denied" pgdump-error.txt; then
              # Si el esquema de cuentas (auth) no se deja leer, se respalda al menos todo lo de la web
              echo "::warning::Sin permiso para leer las cuentas (auth). Se respaldan solo los datos de la web (public)."
              if ! /usr/lib/postgresql/17/bin/pg_dump "$DB" --no-owner --no-privileges --schema=public -f respaldo.sql 2> pgdump-error.txt; then
                echo "::error::pg_dump falló también solo con public."
                exit 1
              fi
            else
              echo "::error::pg_dump falló. Detalle (sin datos de conexión):"
            fi
            if [ -s pgdump-error.txt ] && ! [ -s respaldo.sql ]; then
              # Se quitan usuario, servidor y cualquier cosa con forma de credencial antes de mostrarlo
              sed -E 's#://[^ ]*#://[oculto]#g; s#[^ ]*:[^ ]*@[^ ]*#[oculto]#g; s#[^ ]*@[^ ]*#[oculto]#g; s#[A-Za-z0-9._%+-]*@[A-Za-z0-9.-]+#[oculto]#g; s#postgres(\.[a-z0-9]+)?#[usuario]#g; s#[A-Za-z0-9.-]*supabase\.(co|com)#[servidor]#g; s#"[^"]*"#"[oculto]"#g' pgdump-error.txt | head -5
              exit 1
            fi
          fi
          gzip -9 respaldo.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASS" -o "respaldo-$FECHA.sql.gz.gpg" respaldo.sql.gz
          rm -f respaldo.sql.gz
          ls -lh respaldo-*.gpg
          echo "ARCHIVO=respaldo-$FECHA.sql.gz.gpg" >> "$GITHUB_ENV"

      - name: Guardar el respaldo
        if: steps.secretos.outputs.listo == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVO }}
          path: ${{ env.ARCHIVO }}
          retention-days: 90
