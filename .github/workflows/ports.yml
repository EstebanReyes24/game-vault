# Actualiza data/ports.json (la sección «Ports nativos») cada semana.
# Lee la lista awesome-unofficial-pc-ports y consulta GitHub para la última versión de cada port.
name: Ports nativos

on:
  schedule:
    - cron: "23 9 * * 1"   # lunes, 05:23 en Bolivia/Rep. Dominicana
  workflow_dispatch: {}     # botón "Run workflow" para hacerlo a mano

permissions:
  contents: write

jobs:
  ports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar la lista
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ports.mjs
      - name: Guardar si cambió
        run: |
          git add -N data/ports-indice.json
          if git diff --quiet -- data/ports.json data/ports-indice.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "Paindex Vault (bot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ports.json data/ports-indice.json
          git commit -m "Ports nativos: actualización semanal"
          git push
      # Con el repositorio privado en el plan Hobby, Vercel no despliega los commits del bot:
      # se pide el despliegue con un Deploy Hook (secreto VERCEL_DEPLOY_HOOK en GitHub).
      - name: Desplegar en Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Sin VERCEL_DEPLOY_HOOK: Vercel desplegará solo si acepta el commit."; exit 0; fi
          if git log -1 --format=%s | grep -q "Ports nativos: actualización semanal"; then
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Despliegue pedido."
          fi
