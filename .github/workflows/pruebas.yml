# Cada vez que Vercel termina de publicar una vista previa (o producción), se abren las páginas
# principales en celular y computadora y se comprueba que no haya errores ni nada desbordado.
name: Prueba de humo

on:
  # Vercel avisa con un "status" en el commit cuando termina de publicar
  status:
  workflow_dispatch:
    inputs:
      base:
        description: "URL a probar"
        required: true
        default: "https://game-vault-beige.vercel.app"

jobs:
  humo:
    if: github.event_name == 'workflow_dispatch' || (github.event.state == 'success' && contains(github.event.context, 'Vercel'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Elegir la dirección a probar
        id: base
        env:
          RAMA: ${{ github.event.branches[0].name }}
          MANUAL: ${{ inputs.base }}
        run: |
          if [ -n "$MANUAL" ]; then echo "url=$MANUAL" >> "$GITHUB_OUTPUT"
          elif [ "$RAMA" = "main" ] || [ -z "$RAMA" ]; then echo "url=https://game-vault-beige.vercel.app" >> "$GITHUB_OUTPUT"
          else
            SLUG=$(echo "$RAMA" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
            echo "url=https://paindex-vault-git-${SLUG}-paindex1.vercel.app" >> "$GITHUB_OUTPUT"
          fi
      - name: Probar páginas
        env:
          BASE: ${{ steps.base.outputs.url }}
        run: |
          echo "Probando $BASE"
          node pruebas/humo.mjs
