<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Vault | Acceso de Jugador</title>
  
  <meta name="theme-color" content="#07090e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="p-4 sm:p-8 flex flex-col items-center justify-between min-h-screen">

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-4">
    <a href="index.html" class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
        <i class="fa-solid fa-gamepad text-base"></i>
      </div>
      <div>
        <span class="text-lg font-black console-font text-white tracking-tight">GAME VAULT</span>
        <span class="text-[9px] uppercase font-bold tracking-widest text-indigo-400 block -mt-1">Player Station</span>
      </div>
    </a>

    <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-1.5">
      <i class="fa-solid fa-arrow-left text-[11px]"></i> Volver
    </a>
  </header>

  <!-- Tarjeta Central de Acceso -->
  <main class="w-full max-w-md my-auto">
    <div class="glass-panel rounded-3xl p-6 sm:p-8 border border-white/15 shadow-2xl space-y-6 relative overflow-hidden">
      
      <div class="space-y-1.5 text-center">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 flex items-center justify-center text-xl mx-auto shadow-inner">
          <i class="fa-solid fa-user-astronaut" id="headerIcon"></i>
        </div>
        <h1 class="text-2xl font-black text-white console-font tracking-tight mt-2" id="authTitle">Iniciar Sesión</h1>
        <p class="text-xs text-slate-400" id="authSubtitle">Conecta tu cuenta para sincronizar tus juegos en la nube</p>
      </div>

      <!-- Alerta de estado / error -->
      <div id="authAlert" class="hidden p-3 rounded-xl text-xs font-semibold border flex items-center gap-2"></div>

      <!-- Formulario -->
      <form id="authForm" class="space-y-3.5">
        
        <!-- Campo: Nombre de Usuario (Solo en Registro) -->
        <div id="usernameField" class="hidden">
          <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1">Nombre de Usuario</label>
          <div class="relative">
            <input type="text" id="authUsername" autocomplete="username" placeholder="Tu gamertag o alias"
                   class="w-full console-input rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none">
            <i class="fa-solid fa-id-badge absolute left-3 top-2.5 text-slate-500 text-xs"></i>
          </div>
        </div>

        <!-- Campo: Correo -->
        <div>
          <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1">Correo Electrónico</label>
          <div class="relative">
            <input type="email" id="authEmail" required autocomplete="email" placeholder="gamer@ejemplo.com"
                   class="w-full console-input rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none">
            <i class="fa-solid fa-envelope absolute left-3 top-2.5 text-slate-500 text-xs"></i>
          </div>
        </div>

        <!-- Campo: Contraseña -->
        <div>
          <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1">Contraseña</label>
          <div class="relative">
            <input type="password" id="authPassword" required minlength="6" autocomplete="current-password" placeholder="Mínimo 6 caracteres"
                   class="w-full console-input rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none">
            <i class="fa-solid fa-lock absolute left-3 top-2.5 text-slate-500 text-xs"></i>
          </div>
        </div>

        <!-- Campo: Confirmar Contraseña (Solo en Registro) -->
        <div id="confirmPasswordField" class="hidden">
          <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1">Confirmar Contraseña</label>
          <div class="relative">
            <input type="password" id="authConfirmPassword" minlength="6" autocomplete="new-password" placeholder="Repite tu contraseña"
                   class="w-full console-input rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none">
            <i class="fa-solid fa-shield-halved absolute left-3 top-2.5 text-slate-500 text-xs"></i>
          </div>
        </div>

        <!-- Campo: Plataforma Principal (Solo en Registro) -->
        <div id="platformField" class="hidden">
          <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1">Plataforma Principal</label>
          <div class="relative">
            <select id="authPlatform" class="w-full console-input rounded-xl pl-9 pr-3 py-2 text-xs text-slate-200 font-bold focus:outline-none cursor-pointer">
              <option value="PC">💻 PC Gamer (Steam, Epic, etc.)</option>
              <option value="PlayStation">🎮 PlayStation</option>
              <option value="Xbox">🟢 Xbox</option>
              <option value="Nintendo">🔴 Nintendo Switch</option>
              <option value="Retro">👾 Consolas Retro</option>
            </select>
            <i class="fa-solid fa-gamepad absolute left-3 top-2.5 text-slate-500 text-xs"></i>
          </div>
        </div>

        <!-- Campo: Aceptación de Términos (Solo en Registro) -->
        <div id="termsField" class="hidden pt-1">
          <label class="flex items-start gap-2 cursor-pointer text-[11px] text-slate-400 select-none">
            <input type="checkbox" id="authTerms" class="rounded accent-indigo-500 mt-0.5">
            <span>Acepto las normas de autoría y privacidad descritas en <a href="legal.html" target="_blank" class="text-indigo-400 hover:underline">Términos & Licencia</a>.</span>
          </label>
        </div>

        <button type="submit" id="authSubmitBtn" class="w-full py-3 rounded-xl btn-primary-action text-white font-black console-font text-xs shadow-xl transition flex items-center justify-center gap-2 cursor-pointer mt-2">
          <i class="fa-solid fa-arrow-right-to-bracket" id="btnIcon"></i>
          <span id="btnText">ENTRAR A MI ESTANTE</span>
        </button>

        <div class="text-center pt-2 border-t border-white/10">
          <button type="button" id="toggleAuthBtn" class="text-xs text-indigo-400 hover:text-indigo-300 font-bold transition cursor-pointer">
            ¿No tienes cuenta? Regístrate aquí
          </button>
        </div>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-md py-4 text-center text-xs text-slate-500">
    <span>Game Vault • © 2026 Pain • Conexión Segura vía Supabase</span>
  </footer>

  <!-- 1. CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Tu archivo de base de datos donde se define DB -->
  <script src="js/supabase.js"></script>

  <!-- 3. Manejador de Login y Registro -->
  <script>
    let isRegisterMode = false;

    const authForm = document.getElementById('authForm');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const headerIcon = document.getElementById('headerIcon');
    const authAlert = document.getElementById('authAlert');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const toggleAuthBtn = document.getElementById('toggleAuthBtn');

    const usernameField = document.getElementById('usernameField');
    const confirmPasswordField = document.getElementById('confirmPasswordField');
    const platformField = document.getElementById('platformField');
    const termsField = document.getElementById('termsField');

    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authUsername = document.getElementById('authUsername');
    const authConfirmPassword = document.getElementById('authConfirmPassword');
    const authTerms = document.getElementById('authTerms');

    function showAlert(msg, isError = true) {
      authAlert.classList.remove('hidden', 'bg-red-500/20', 'border-red-500/40', 'text-red-300', 'bg-emerald-500/20', 'border-emerald-500/40', 'text-emerald-300');
      if (isError) {
        authAlert.classList.add('bg-red-500/20', 'border-red-500/40', 'text-red-300');
        authAlert.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>${msg}</span>`;
      } else {
        authAlert.classList.add('bg-emerald-500/20', 'border-emerald-500/40', 'text-emerald-300');
        authAlert.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${msg}</span>`;
      }
    }

    function hideAlert() {
      authAlert.classList.add('hidden');
    }

    // Alternar entre Iniciar Sesión y Registrarse
    toggleAuthBtn.addEventListener('click', () => {
      hideAlert();
      isRegisterMode = !isRegisterMode;

      if (isRegisterMode) {
        authTitle.innerText = "Crear Cuenta";
        authSubtitle.innerText = "Únete a la estación para guardar tus juegos";
        headerIcon.className = "fa-solid fa-user-plus";
        btnText.innerText = "CREAR MI CUENTA";
        btnIcon.className = "fa-solid fa-sparkles";
        toggleAuthBtn.innerText = "¿Ya tienes cuenta? Inicia sesión aquí";

        usernameField.classList.remove('hidden');
        confirmPasswordField.classList.remove('hidden');
        platformField.classList.remove('hidden');
        termsField.classList.remove('hidden');

        authUsername.required = true;
        authConfirmPassword.required = true;
      } else {
        authTitle.innerText = "Iniciar Sesión";
        authSubtitle.innerText = "Conecta tu cuenta para sincronizar tus juegos en la nube";
        headerIcon.className = "fa-solid fa-user-astronaut";
        btnText.innerText = "ENTRAR A MI ESTANTE";
        btnIcon.className = "fa-solid fa-arrow-right-to-bracket";
        toggleAuthBtn.innerText = "¿No tienes cuenta? Regístrate aquí";

        usernameField.classList.add('hidden');
        confirmPasswordField.classList.add('hidden');
        platformField.classList.add('hidden');
        termsField.classList.add('hidden');

        authUsername.required = false;
        authConfirmPassword.required = false;
      }
    });

    // Enviar Formulario
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      if (typeof DB === 'undefined') {
        showAlert("Error de carga: js/supabase.js no se ha encontrado.", true);
        return;
      }

      const email = authEmail.value.trim();
      const password = authPassword.value;

      authSubmitBtn.disabled = true;
      btnIcon.className = "fa-solid fa-spinner fa-spin";

      try {
        if (isRegisterMode) {
          const username = authUsername.value.trim();
          const confirmPassword = authConfirmPassword.value;

          if (password !== confirmPassword) {
            throw new Error("Las contraseñas no coinciden.");
          }
          if (!authTerms.checked) {
            throw new Error("Debes aceptar los términos y condiciones.");
          }

          await DB.signUp(email, password, username);
          showAlert("¡Cuenta creada exitosamente! Redirigiendo...", false);
          setTimeout(() => {
            window.location.href = "app.html";
          }, 1000);

        } else {
          await DB.signIn(email, password);
          showAlert("Sesión iniciada. Entrando al estante...", false);
          setTimeout(() => {
            window.location.href = "app.html";
          }, 700);
        }
      } catch (err) {
        console.error(err);
        let errorMsg = err.message || "Error al procesar la solicitud.";
        if (errorMsg.includes("Invalid login credentials")) {
          errorMsg = "Correo o contraseña incorrectos.";
        } else if (errorMsg.includes("Email not confirmed")) {
          errorMsg = "Debes confirmar tu correo antes de entrar.";
        }
        showAlert(errorMsg, true);
      } finally {
        authSubmitBtn.disabled = false;
        btnIcon.className = isRegisterMode ? "fa-solid fa-sparkles" : "fa-solid fa-arrow-right-to-bracket";
      }
    });
  </script>
</body>
</html>
